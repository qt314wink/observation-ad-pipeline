name: Audio Reactive Lab
on:
  pull_request:
    paths:
      - "integrations/audio-reactive/**"
      - "docs/audio-reactive-ozora-2025.md"
      - "skills/audio-reactive-motion/**"
      - ".github/workflows/audio-reactive-lab.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse browser modules and validate contract tests
        run: |
          node --check integrations/audio-reactive/engine.mjs
          node --check integrations/audio-reactive/app.mjs
          node --test integrations/audio-reactive/*.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify native audio and capture provenance
        run: python integrations/audio-reactive/browser.test.py
      - uses: actions/upload-artifact@v4
        with:
          name: audio-reactive-capture-${{ github.sha }}-${{ github.run_attempt }}
          path: audio-reactive-evidence/
          retention-days: 30
          if-no-files-found: error

