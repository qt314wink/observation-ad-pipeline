name: Motion Program Validation

on:
  pull_request:
    paths:
      - 'schemas/motion-program.schema.json'
      - 'src/obsad/motion_program.py'
      - 'src/obsad/schemas/**'
      - 'pyproject.toml'
      - 'examples/motion-programs/**'
      - 'config/motion-program-semantics-authority.yaml'
      - 'docs/MOTION_PROGRAM.md'
      - 'tests/test_motion_*.py'
      - '.github/workflows/motion-program-validation.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/motion-program.schema.json'
      - 'src/obsad/motion_program.py'
      - 'src/obsad/schemas/**'
      - 'pyproject.toml'
      - 'examples/motion-programs/**'
      - 'config/motion-program-semantics-authority.yaml'
      - 'docs/MOTION_PROGRAM.md'
      - 'tests/test_motion_*.py'
      - '.github/workflows/motion-program-validation.yml'

permissions:
  contents: read

jobs:
  motion-program:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install built package
        run: python -m pip install .
      - name: Run focused Motion Program tests
        run: python -m unittest discover -s tests -p 'test_motion_*.py' -v
