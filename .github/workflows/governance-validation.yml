name: Governance Validation

on:
  pull_request:
    paths:
      - 'config/prompt-family-provenance/**'
      - 'config/semantic-change-proposals/**'
      - 'config/downstream-impacts/**'
      - 'config/motion-analysis-profiles/**'
      - 'prompt-packs/**'
      - 'integrations/wan/**'
      - 'experiments/wan/**'
      - 'motion-primitives/**'
      - 'fixtures/motion/**'
      - 'fixtures/motion-references/**'
      - 'schemas/prompt-family-provenance.schema.json'
      - 'schemas/semantic-change-proposal.schema.json'
      - 'schemas/downstream-impact.schema.json'
      - 'schemas/motion-analysis.schema.json'
      - 'schemas/motion-reference-analysis.schema.json'
      - 'schemas/motion-primitive-candidate.schema.json'
      - 'src/obsad/validate_governance.py'
      - 'src/obsad/validate_motion.py'
      - 'src/obsad/motion_reference.py'
      - 'src/obsad/cli.py'
      - 'tests/test_governance_validation.py'
      - 'tests/test_motion_analysis.py'
      - 'tests/test_motion_reference_cli.py'
      - 'tests/test_review_ui.py'
      - 'review/**'
      - '.gitattributes'
      - 'vercel.json'
      - '.github/workflows/governance-validation.yml'
  push:
    branches: [main]
    paths:
      - 'config/prompt-family-provenance/**'
      - 'config/semantic-change-proposals/**'
      - 'config/downstream-impacts/**'
      - 'config/motion-analysis-profiles/**'
      - 'prompt-packs/**'
      - 'integrations/wan/**'
      - 'experiments/wan/**'
      - 'motion-primitives/**'
      - 'fixtures/motion/**'
      - 'fixtures/motion-references/**'
      - 'schemas/prompt-family-provenance.schema.json'
      - 'schemas/semantic-change-proposal.schema.json'
      - 'schemas/downstream-impact.schema.json'
      - 'schemas/motion-analysis.schema.json'
      - 'schemas/motion-reference-analysis.schema.json'
      - 'schemas/motion-primitive-candidate.schema.json'
      - 'src/obsad/validate_governance.py'
      - 'src/obsad/validate_motion.py'
      - 'src/obsad/motion_reference.py'
      - 'src/obsad/cli.py'
      - 'tests/test_governance_validation.py'
      - 'tests/test_motion_analysis.py'
      - 'tests/test_motion_reference_cli.py'
      - 'tests/test_review_ui.py'
      - 'review/**'
      - '.gitattributes'
      - 'vercel.json'
      - '.github/workflows/governance-validation.yml'

permissions:
  contents: read

jobs:
  validate-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Validate provenance, governed evolution, downstream impacts, semantic drift, and Wan boundary
        run: python -m obsad.validate_governance
      - name: Run governance tests
        run: pytest -q tests/test_governance_validation.py tests/test_motion_analysis.py tests/test_motion_reference_cli.py tests/test_review_ui.py
