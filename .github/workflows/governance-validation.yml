name: Governance Validation

on:
  pull_request:
    paths:
      - 'config/prompt-family-provenance/**'
      - 'config/semantic-change-proposals/**'
      - 'prompt-packs/**'
      - 'integrations/wan/**'
      - 'schemas/prompt-family-provenance.schema.json'
      - 'schemas/semantic-change-proposal.schema.json'
      - 'src/obsad/validate_governance.py'
      - 'tests/test_governance_validation.py'
      - '.github/workflows/governance-validation.yml'
  push:
    branches: [main]
    paths:
      - 'config/prompt-family-provenance/**'
      - 'config/semantic-change-proposals/**'
      - 'prompt-packs/**'
      - 'integrations/wan/**'
      - 'schemas/prompt-family-provenance.schema.json'
      - 'schemas/semantic-change-proposal.schema.json'
      - 'src/obsad/validate_governance.py'
      - 'tests/test_governance_validation.py'
      - '.github/workflows/governance-validation.yml'

permissions:
  contents: read

jobs:
  validate-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Validate provenance, governed evolution, semantic drift, and Wan boundary
        run: python -m obsad.validate_governance
      - name: Run governance tests
        run: pytest -q tests/test_governance_validation.py
