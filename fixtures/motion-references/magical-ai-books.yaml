schemaVersion: '1.0.0'
referenceId: video:reference:kelly-boesch:magical-ai-books
humanGuide:
  point: >-
    Study how a representation becomes physically consequential without reducing the reference
    to an aesthetic prompt: preserve what the subject looks and feels like, how it changes through
    the threshold, how it moves, what the real world does in response, and what remains uncertain.
  proofChain:
    - reference
    - subject state story
    - scene evidence
    - movement quality
    - manner
    - interpretation
    - director control
    - controlled test
  blockers:
    - The retained source video is not present, so exact technical media measurements and frame-level timing are blocked.
    - Higgsfield scene descriptions are imported evidence, not human-verified ground truth.
    - The owl is described as paper-textured; true origami structure, crease topology, fold sequence, and panel adjacency are not verified.
    - Director-provided manner words still need scene-by-scene mapping against hydrated media.
