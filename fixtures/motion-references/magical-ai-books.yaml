schemaVersion: '1.0.0'
referenceId: video:reference:kelly-boesch:magical-ai-books

humanGuide:
  point: >-
    Recover what makes representation-to-reality motion believable and directable: what the subject looks like,
    how its material seems to behave, how movement is phrased, how it crosses the source plane,
    and what the surrounding room does in response.
  proofChain:
    - reference
    - subject state story
    - scene evidence
    - movement quality
    - manner
    - interpretation
    - director control
    - controlled test
  blockers:
    - Source media is not hydrated, so frame-level timing and technical media measurements remain blocked.
    - Higgsfield scene descriptions are imported-unverified until a human checks source frames.
    - The owl is paper-textured in the analyzer description; true origami structure is not verified.
    - Director manner words still require scene-by-scene mapping against source media.

