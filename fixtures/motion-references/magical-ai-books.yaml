interpretations:
  - id: INF.REPRESENTATION_BOUNDARY_BREACH
    label: representation-boundary-breach
    statement: A recognizable source surface may remain visible while selected content gains depth and crosses into shared room space.
    evidence: [OBS.S01.OWL_BEHAVIOR, OBS.S02.WAVE_EDGE, OBS.S03.DEER_GUTTER, OBS.S04.GEAR_RISE, OBS.S06.PYRAMIDS, OBS.S09.CITY_DEPTH]
    confidence: 0.92
    status: candidate
    falsifier: If removing source-plane visibility preserves the same clarity, boundary persistence is less load-bearing than expected.
    usefulness: Creates a transferable mechanism rather than a book-specific aesthetic prompt.
  - id: INF.DIEGETIC_WITNESS_INTERACTION
    label: diegetic-witness-interaction
    statement: Hands and bodies may act as scale, occlusion, lighting, and contact witnesses that make impossible content feel co-located with the room.
    evidence: [OBS.S08.FLOAT_HANDOFF, OBS.S09.HAND_SHADOW]
    confidence: 0.9
    status: candidate
    falsifier: If matched generations without a witness feel equally spatially credible, the witness is optional rather than structural.
    usefulness: Provides a concrete art-direction tactic for believable impossible physicality.
  - id: INF.SOURCE_PLANE_PERSISTENCE
    label: source-plane-persistence
    statement: Keeping the book or page readable lets the viewer compare flat origin and spatial consequence simultaneously.
    evidence: [OBS.S01.BOOK_CONTEXT, OBS.S02.WAVE_EDGE, OBS.S03.DEER_GUTTER, OBS.S04.GEAR_RISE]
    confidence: 0.9
    status: candidate
    falsifier: If the page can disappear early without reducing the breach reading, persistence is not required.
    usefulness: Becomes a director control and QA metric.
  - id: INF.LOCALIZED_DEPTH_ESCALATION
    label: localized-depth-escalation
    statement: Depth appears to escalate locally while surrounding book context stays stable.
    evidence: [OBS.S01.OWL_APPEARANCE, OBS.S02.WAVE_EDGE, OBS.S03.DEER_GUTTER, OBS.S04.GEAR_RISE, OBS.S06.PYRAMIDS, OBS.S09.CITY_DEPTH]
    confidence: 0.86
    status: candidate
    falsifier: If full-frame transformation gives equal clarity and causality, localized escalation is less important.
    usefulness: Supports staged relief, partial-breach, and full-breach experiments.
  - id: INF.PHYSICAL_CONSEQUENCE
    label: physical-consequence-as-believability-proof
    statement: Light spill, page-edge spill, particles, direct handoff, and shadow may persuade the eye that impossible content shares the room.
    evidence: [OBS.S01.OWL_BEHAVIOR, OBS.S02.WAVE_EDGE, OBS.S05.LIGHT_SPILL, OBS.S08.FLOAT_HANDOFF, OBS.S09.HAND_SHADOW]
    confidence: 0.94
    status: candidate
    falsifier: If boundary crossing without cross-world consequence remains equally convincing, consequence is optional.
    usefulness: Gives QA a reason to reject pretty outputs that do not affect their surroundings.

directorControls:
  - id: source_plane_persistence
    label: Source-plane persistence
    question: How long should the original page remain readable while the subject becomes spatial?
    targetFields: [composition.relationshipToSourcePlane]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.85
    locked: false
    whatYouWillSee: Higher values keep the page visible behind or beneath emerging content longer.
    tooLowLooksLike: The scene reads like a cut or global morph.
    tooHighLooksLike: The subject never feels free of the source.
    evidence: [OBS.S01.BOOK_CONTEXT, OBS.S02.WAVE_EDGE]
    confidence: 0.9
    basis: observation-backed
  - id: breach_amount
    label: Breach amount
    question: How far should the subject cross from representation into shared physical space?
    targetFields: [spatialPath, composition.relationshipToSourcePlane]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.75
    locked: false
    whatYouWillSee: Higher values move more of the subject beyond the source plane.
    tooLowLooksLike: Relief only; the subject never clearly crosses.
    tooHighLooksLike: The subject detaches so completely that its origin becomes unclear.
    evidence: [OBS.S01.OWL_BEHAVIOR, OBS.S02.WAVE_EDGE, OBS.S03.DEER_GUTTER]
    confidence: 0.9
    basis: observation-backed
  - id: panel_rigidity
    label: Panel rigidity
    question: How stiff should paper-like regions remain while they move?
    targetFields: [materialBehavior.rigidity, movementQuality.stiffness]
    valueType: enum
    allowedValues: [soft, supple, firm, stiff, rigid]
    defaultValue: stiff
    locked: false
    whatYouWillSee: Higher values keep local regions flatter and less rubbery.
    tooLowLooksLike: Paper-like forms wobble like cloth or rubber.
    tooHighLooksLike: The subject becomes mechanically frozen.
    evidence: [OBS.S01.OWL_APPEARANCE, OBS.DIR.MANNER_VOCAB]
    confidence: 0.45
    basis: inference-backed
  - id: fold_localization
    label: Fold localization
    question: Should deformation happen mostly at crease-like joints or across the whole surface?
    targetFields: [materialBehavior.articulationLocality, structuralMechanisms]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.7
    locked: false
    whatYouWillSee: Higher values concentrate angle change around seams while faces remain calmer.
    tooLowLooksLike: The whole form bends and loses constructed-paper character.
    tooHighLooksLike: Every movement becomes an obvious hinge whether or not the source supports it.
    evidence: [OBS.S01.OWL_APPEARANCE, OBS.DIR.MANNER_VOCAB]
    confidence: 0.4
    basis: exploratory
  - id: stagger_amount
    label: Stagger amount
    question: How much delay should neighboring parts have before following the leader?
    targetFields: [manner.coordination, manner.cadence]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.5
    locked: false
    whatYouWillSee: Higher values create more obvious lead-lag and sequential release.
    tooLowLooksLike: Everything moves at once and loses phrasing.
    tooHighLooksLike: Parts react so late that the structure seems broken.
    evidence: [OBS.DIR.MANNER_VOCAB]
    confidence: 0.35
    basis: exploratory
  - id: cascade_direction
    label: Cascade direction
    question: Where should movement begin and in what order should it travel?
    targetFields: [manner.leadPart, manner.followParts, manner.phaseSequence]
    valueType: text
    defaultValue: source-root outward
    locked: false
    whatYouWillSee: A readable initiation point followed by a propagation path.
    tooLowLooksLike: There is no clear initiation point.
    tooHighLooksLike: The sequence becomes theatrically mechanical.
    evidence: [OBS.DIR.MANNER_VOCAB, OBS.S07.PAGE_BLOOM]
    confidence: 0.4
    basis: exploratory
  - id: catch_lock_strength
    label: Catch and lock strength
    question: Should parts briefly catch or settle into intermediate configurations?
    targetFields: [manner.transitionCharacter]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.35
    locked: false
    whatYouWillSee: Higher values create brief perceptible holds before release.
    tooLowLooksLike: Motion becomes frictionless and generic.
    tooHighLooksLike: Motion repeatedly stalls.
    evidence: [OBS.DIR.MANNER_VOCAB, OBS.S04.GEAR_RISE]
    confidence: 0.35
    basis: exploratory
  - id: secondary_lag
    label: Secondary lag
    question: How much should secondary parts trail the main movement?
    targetFields: [manner.followParts, manner.phaseSequence, manner.microMannerisms]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.35
    locked: false
    whatYouWillSee: Edges, appendages, or particles continue after the initiating mass.
    tooLowLooksLike: Everything feels mathematically synchronized.
    tooHighLooksLike: Secondary motion detaches from the cause.
    evidence: [OBS.S01.OWL_BEHAVIOR, OBS.S07.PAGE_BLOOM, OBS.DIR.MANNER_VOCAB]
    confidence: 0.4
    basis: exploratory
  - id: asymmetry
    label: Asymmetry
    question: How perfectly should paired or repeated parts match in timing and pose?
    targetFields: [manner.microMannerisms, movementQuality]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.2
    locked: false
    whatYouWillSee: Higher values introduce small timing and pose differences.
    tooLowLooksLike: Mirror-perfect motion can feel sterile.
    tooHighLooksLike: The structure loses coherence.
    evidence: [OBS.DIR.MANNER_VOCAB]
    confidence: 0.25
    basis: exploratory
  - id: settling_amount
    label: Settling amount
    question: After the main movement, how much visible settling should remain?
    targetFields: [manner.transitionCharacter, manner.microMannerisms]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.3
    locked: false
    whatYouWillSee: Higher values allow a final adjustment, fade, or residual motion.
    tooLowLooksLike: Motion stops abruptly.
    tooHighLooksLike: The object keeps wobbling and weakens the reveal.
    evidence: [OBS.S10.CLOSURE, OBS.S01.OWL_BEHAVIOR]
    confidence: 0.55
    basis: inference-backed
  - id: witness_interaction
    label: Witness interaction
    question: How strongly should a real hand or object prove shared space?
    targetFields: [interaction]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.75
    locked: false
    whatYouWillSee: Higher values add touch, handoff, occlusion, shadow, or light exchange.
    tooLowLooksLike: The magical layer reads like an overlay.
    tooHighLooksLike: The witness becomes a demonstration gimmick.
    evidence: [OBS.S08.FLOAT_HANDOFF, OBS.S09.HAND_SHADOW]
    confidence: 0.9
    basis: observation-backed
  - id: camera_reaction
    label: Camera reaction
    question: How much should the camera react to the impossible event?
    targetFields: [camera]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.35
    locked: false
    whatYouWillSee: Higher values allow push, pan, or pullback motivated by emergence.
    tooLowLooksLike: Scale changes can be harder to read.
    tooHighLooksLike: Camera spectacle hides whether the effect is coherent.
    evidence: [OBS.S01.BOOK_CONTEXT, OBS.S10.CLOSURE]
    confidence: 0.75
    basis: observation-backed
  - id: environment_spill
    label: Environment spill
    question: How much should light, particles, water, smoke, or shadow escape into the room?
    targetFields: [interaction, environment, lightColor]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.65
    locked: false
    whatYouWillSee: Higher values make the room visibly respond to impossible content.
    tooLowLooksLike: The effect stays sealed inside the page.
    tooHighLooksLike: Spill overwhelms the source relationship.
    evidence: [OBS.S01.OWL_BEHAVIOR, OBS.S02.WAVE_EDGE, OBS.S05.LIGHT_SPILL, OBS.S09.HAND_SHADOW]
    confidence: 0.9
    basis: observation-backed

candidatePrimitives:
  - id: representation-boundary-breach.v1
    status: candidate
    evidence:
      - OBS.S01.OWL_BEHAVIOR
      - OBS.S02.WAVE_EDGE
      - OBS.S03.DEER_GUTTER
      - OBS.S04.GEAR_RISE
      - OBS.S06.PYRAMIDS
      - OBS.S09.CITY_DEPTH
    directorControls:
      - source_plane_persistence
      - breach_amount
      - panel_rigidity
      - fold_localization
      - stagger_amount
      - cascade_direction
      - catch_lock_strength
      - secondary_lag
      - asymmetry
      - settling_amount
      - witness_interaction
      - camera_reaction
      - environment_spill
    states: [latent, activated, dimensionalized, boundary-crossing, consequential, expanded, resolved]
    requiredCues:
      - recognizable source plane
      - localized depth change
      - legible crossing or above-plane occupation
      - traceable subject identity
    optionalCues:
      - witness interaction
      - environment spill
      - closure or reversibility
      - material-specific mannerism
    antiPatterns:
      - global soup morph
      - instant subject replacement
      - camera spectacle hiding unstable geometry
      - rubbery paper when fold-constrained motion is intended

experimentGate:
  status: blocked
  candidatePrimitiveRefs: [representation-boundary-breach.v1]
  reason: Candidate primitive is not promoted and source media is not hydrated for frame-level verification.
  experimentManifest: experiments/wan/representation-boundary-breach.yaml
