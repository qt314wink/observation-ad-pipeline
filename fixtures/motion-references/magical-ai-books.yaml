interpretations:
  - id: INF.REPRESENTATION_BOUNDARY_BREACH
    label: representation-boundary-breach
    statement: The recurring mechanism may depend on keeping a recognizable source surface visible while selected content acquires depth and crosses that surface into shared room space.
    evidence: [OBS.S01.OWL_BEHAVIOR, OBS.S02.WAVE_EDGE, OBS.S03.DEER_GUTTER, OBS.S04.GEAR_RISE, OBS.S06.PYRAMIDS, OBS.S09.CITY_DEPTH]
    confidence: 0.92
    status: candidate
    falsifier: If source-plane visibility is removed and the effect remains equally legible as the same mechanism, source-boundary persistence is less load-bearing than hypothesized.
    usefulness: Gives Motion Oracle and generation experiments a transferable mechanism rather than a book-specific aesthetic prompt.
  - id: INF.DIEGETIC_WITNESS_INTERACTION
    label: diegetic-witness-interaction
    statement: Human hands and the human body may function as scale, occlusion, lighting, and contact witnesses that make impossible content feel co-located with the room.
    evidence: [OBS.S02.PAGE_HAND, OBS.S03.HAND_ORBS, OBS.S04.HAND_POINT, OBS.S08.FLOAT_HANDOFF, OBS.S09.HAND_SHADOW]
    confidence: 0.9
    status: candidate
    falsifier: If otherwise matched generations without any human/real-world witness remain equally spatially convincing, the witness may be optional rather than structural.
    usefulness: Provides a concrete art-direction tactic for product, editorial, fashion, interface, and portfolio scenes that need believable impossible physicality.
  - id: INF.SOURCE_PLANE_PERSISTENCE
    label: source-plane-persistence
    statement: The book/page remains readable as an origin while depth emerges, allowing the viewer to compare the flat source and spatial consequence simultaneously.
    evidence: [OBS.S01.BOOK_CONTEXT, OBS.S02.WAVE_EDGE, OBS.S03.DEER_GUTTER, OBS.S04.GEAR_RISE, OBS.S06.PYRAMIDS]
    confidence: 0.9
    status: candidate
    falsifier: If the page can disappear early without reducing the boundary-breach reading, persistent source-plane visibility is not required.
    usefulness: Becomes a director control and benchmark metric for distinguishing controlled emergence from replacement/morph artifacts.
  - id: INF.LOCALIZED_DEPTH_ESCALATION
    label: localized-depth-escalation
    statement: Several scenes appear to escalate depth locally—specific owl, wave, deer, gear, pyramid, or city elements gain volume while surrounding book context stays stable.
    evidence: [OBS.S01.OWL_APPEARANCE, OBS.S02.WAVE_EDGE, OBS.S03.DEER_GUTTER, OBS.S04.GEAR_RISE, OBS.S06.PYRAMIDS, OBS.S09.CITY_DEPTH]
    confidence: 0.86
    status: candidate
    falsifier: If full-frame transformation produces the same clarity and causality, localized escalation is less important than expected.
    usefulness: Suggests staged Wan/Comfy tests that isolate relief, partial breach, and full breach instead of solving the whole scene in one pass.
  - id: INF.PHYSICAL_CONSEQUENCE
    label: physical-consequence-as-believability-proof
    statement: Light spill, hard shadows, page-edge spill, particles, and actual handoff/contact may act as physical consequences that persuade the eye the impossible content shares the room.
    evidence: [OBS.S01.LIGHT_HAND, OBS.S02.WAVE_EDGE, OBS.S05.LIGHT_SPILL, OBS.S06.SHADOWS, OBS.S08.FLOAT_HANDOFF, OBS.S09.HAND_SHADOW]
    confidence: 0.94
    status: candidate
    falsifier: If a boundary crossing without any cross-world light, shadow, contact, spill, or occlusion remains equally convincing, physical consequence is optional rather than a proof cue.
    usefulness: Gives QA a concrete reason to reject visually pretty outputs that fail to affect their surrounding world.
directorControls:
  - id: source_plane_persistence
    label: Source-plane persistence
    question: How long should the original page or image remain clearly readable while the subject becomes spatial?
    targetFields: [composition.relationshipToSourcePlane]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.85
    locked: false
    whatYouWillSee: Higher values keep the page/book visually legible behind or beneath the emerging content for longer.
    tooLowLooksLike: The page disappears and the scene reads like a cut or global morph.
    tooHighLooksLike: The source surface dominates so strongly that the subject never feels free of it.
    evidence: [OBS.S01.BOOK_CONTEXT, OBS.S02.WAVE_EDGE, OBS.S03.DEER_GUTTER]
    confidence: 0.9
    basis: observation-backed
  - id: breach_amount
    label: Breach amount
    question: How far should the subject cross from representation into shared physical space?
    targetFields: [spatialPath, composition.relationshipToSourcePlane]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.75
    locked: false
    whatYouWillSee: Higher values move more of the subject beyond the page/frame and increase overlap with room space.
    tooLowLooksLike: Relief or embossing only; the subject never clearly crosses the boundary.
    tooHighLooksLike: The subject detaches so completely that its origin in the representation becomes unclear.
    evidence: [OBS.S01.OWL_BEHAVIOR, OBS.S02.WAVE_EDGE, OBS.S03.DEER_GUTTER, OBS.S04.GEAR_RISE]
    confidence: 0.9
    basis: observation-backed
  - id: panel_rigidity
    label: Panel rigidity
    question: How stiff should paper-like regions remain while they move?
    targetFields: [materialBehavior.rigidity, movementQuality.stiffness]
    valueType: enum
    allowedValues: [soft, supple, firm, stiff, rigid]
    defaultValue: stiff
    locked: false
    whatYouWillSee: Higher values keep local regions flatter and less rubbery as they articulate.
    tooLowLooksLike: Paper-like forms wobble or stretch like cloth, skin, or rubber.
    tooHighLooksLike: The subject becomes a frozen mechanical sculpture with no necessary compliance.
    evidence: [OBS.S01.OWL_APPEARANCE, OBS.DIR.MANNER_VOCAB]
    confidence: 0.45
    basis: inference-backed
  - id: fold_localization
    label: Fold localization
    question: Should deformation happen mostly at crease-like joints or spread continuously across the surface?
    targetFields: [materialBehavior.articulationLocality, structuralMechanisms]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.7
    locked: false
    whatYouWillSee: Higher values concentrate angle change around distinct seams/hinges while faces remain calmer.
    tooLowLooksLike: The whole form bends continuously and may lose its constructed-paper character.
    tooHighLooksLike: Every motion becomes an obvious mechanical hinge regardless of the source evidence.
    evidence: [OBS.S01.OWL_APPEARANCE, OBS.DIR.MANNER_VOCAB]
    confidence: 0.4
    basis: exploratory
  - id: stagger_amount
    label: Stagger amount
    question: How much delay should neighboring parts have before following the leading part?
    targetFields: [manner.coordination, manner.cadence]
    valueType: number
    min: 0
    max: 1
    defaultValue: 0.5
    locked: false
    whatYouWillSee: Higher values create more obvious lead/lag and sequential release across parts.
    tooLowLooksLike: Everything moves at once and loses articulated phrasing.
    tooHighLooksLike: The subject appears broken into unrelated steps or reacts too late.
    evidence: [OBS.DIR.MANNER_VOCAB]
    confidence: 0.35
    basis: exploratory
  - id: cascade_direction
    label: Cascade direction
    question: Where should the movement begin, and in what order should it travel through the structure?
    targetFields: [manner.leadPart, manner.followParts, manner.phaseSequence]
    valueType: text
    defaultValue: source-root outward
    locked: false
    whatYouWillSee: A clear initiating region followed by a readable propagation path rather than undirected simultaneous motion.
    tooLowLooksLike: There is no readable initiation point.
    tooHighLooksLike: The sequence becomes theatrical or mechanically obvious instead of organic to the object.
    evidence: [OBS.DIR.MANNER_VOCAB, OBS.S07.PAGE_BLOOM]
    confidence: 0.4
    basis: exploratory
