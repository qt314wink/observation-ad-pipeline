    continuityQuestions:
      - Does silhouette, paper texture, eye treatment, and apparent thickness survive every phase?
      - Are wing regions rigid panels, flexing paper surfaces, or free CG morphs?
      - Which body part leads emergence and which parts lag?
      - Is delay simultaneous, staggered, cascading, or asymmetrical?
      - Do parts catch, lock, release, overshoot, or settle?
      - Does the owl cast or receive contact shadow after becoming spatial?
    unknowns:
      - body color beyond glowing yellow eyes
      - feather or panel silhouette construction
      - exact crease locations and fold assignments
      - rigid-face versus flexible-surface behavior
      - thickness and edge treatment
      - wing lead-lag and stagger cadence
      - micro-mannerisms such as head lag, edge tremor, panel flutter, or corrective settle
      - stable final pose before the cut

