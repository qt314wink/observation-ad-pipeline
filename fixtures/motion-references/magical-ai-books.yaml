    scope: reference
    provenance: {kind: director-provided, sourceRef: WORKING-SESSION-2026-08-24}
    verificationStatus: imported-unverified
    verificationTask: Map this word to specific parts, scenes, and phases; distinguish actual rigid regions from merely stiff-looking motion.
  - term: staggered
    scope: reference
    provenance: {kind: director-provided, sourceRef: WORKING-SESSION-2026-08-24}
    verificationStatus: imported-unverified
    verificationTask: Identify lead/lag relationships and whether delays are consistent, cascading, or irregular.
  - term: stiff
    scope: reference
    provenance: {kind: director-provided, sourceRef: WORKING-SESSION-2026-08-24}
    verificationStatus: imported-unverified
    verificationTask: Distinguish stiffness impression from verified material rigidity.
  - term: shuffling
    scope: reference
    provenance: {kind: director-provided, sourceRef: WORKING-SESSION-2026-08-24}
    verificationStatus: imported-unverified
    verificationTask: Identify repeated sliding/reordering or page/panel motion that genuinely reads as a shuffle.
  - term: tessellating
    scope: reference
    provenance: {kind: director-provided, sourceRef: WORKING-SESSION-2026-08-24}
    verificationStatus: imported-unverified
    verificationTask: Verify whether repeated panels tile/reconfigure or whether the impression comes from faceted surface design.
  - term: bending
    scope: reference
    provenance: {kind: director-provided, sourceRef: WORKING-SESSION-2026-08-24}
    verificationStatus: imported-unverified
    verificationTask: Locate distributed curvature versus crease-localized articulation.
  - term: wrapping
    scope: reference
    provenance: {kind: director-provided, sourceRef: WORKING-SESSION-2026-08-24}
    verificationStatus: imported-unverified
    verificationTask: Identify surfaces or parts that curl around an edge or another body.
  - term: folding
    scope: reference
    provenance: {kind: director-provided, sourceRef: WORKING-SESSION-2026-08-24}
    verificationStatus: imported-unverified
    verificationTask: Verify actual fold-like articulation and do not infer mountain/valley assignments without evidence.
  - term: contorting
    scope: reference
    provenance: {kind: director-provided, sourceRef: WORKING-SESSION-2026-08-24}
    verificationStatus: imported-unverified
    verificationTask: Identify shape changes that preserve identity while significantly altering orientation or topology.
  - term: linking
    scope: reference
    provenance: {kind: director-provided, sourceRef: WORKING-SESSION-2026-08-24}
    verificationStatus: imported-unverified
    verificationTask: Identify mechanically or visually coupled parts, especially gear and panel relationships.
  - term: creasing
    scope: reference
    provenance: {kind: director-provided, sourceRef: WORKING-SESSION-2026-08-24}
    verificationStatus: imported-unverified
    verificationTask: Verify visible crease formation or crease-guided rotation rather than paper texture alone.
