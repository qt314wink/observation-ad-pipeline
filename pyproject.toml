[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="observation-ad-pipeline"
version="0.2.1"
requires-python=">=3.10"
dependencies=["click>=8.1,<9","fastjsonschema>=2.20,<3","PyYAML>=6,<7","requests>=2.32,<3","python-dotenv>=1,<2"]
[project.scripts]
obsad="obsad.cli:main"
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
[tool.setuptools.package-data]
"obsad.schemas"=["*.json"]
