schemaVersion: '1.0.0'
primitiveId: representation-boundary-breach.v1
name: Representation Boundary Breach
status: candidate
sourceReference: video:reference:kelly-boesch:magical-ai-books
states:
  - latent
  - activated
  - dimensionalized
  - boundary-crossing
  - consequential
  - expanded
  - resolved
requiredCues:
  - A recognizable source plane, page, frame, screen, diagram, package, or other containing representation remains legible.
  - A localized subject or region gains relief/depth rather than the entire image globally morphing at once.
  - The subject occupies or crosses space that was previously outside the source representation.
  - Identity remains traceable from representation to spatial subject.
optionalCues:
  - Real-world witness interaction such as touch, occlusion, handoff, shadow, or light exchange.
  - Environmental spill such as particles, water, smoke, light, or sound leaving the representation.
  - Material-specific constrained motion such as fold, hinge, bend, stack, link, or tessellation.
  - Reverse closure that returns the impossible state to its source object.
antiPatterns:
  - Global soup morph that destroys the source plane before the boundary change is legible.
  - Instant subject replacement with no continuity from represented state to spatial state.
  - Spectacular camera motion that hides unstable geometry or ambiguous causality.
  - Paper-looking surfaces that stretch like rubber when a fold-constrained manner is intended.
  - Claiming origami mechanics from paper texture alone.
