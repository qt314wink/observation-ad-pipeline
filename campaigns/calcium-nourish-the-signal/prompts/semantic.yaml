subject:
  - A restrained bioelectric signal passes from a microscopic membrane network into an authentic human moment.
intent:
  - Make scientific or behavioral information emotionally understandable without implying diagnosis, treatment, or efficacy.
camera:
  - Begin with a slow controlled 90–100 mm macro push and shallow depth.
  - Resolve into a settled 35–50 mm documentary frame with broader depth.
motion:
  - Pulse, propagate, branch, diffuse, breathe, focus, reach, then settle; every state causally motivates the next.
light:
  - Directional biological luminosity is the visible carrier of the signal.
environment:
  - Mineral white, warm neutral, carbon, botanical green, and restrained cyan across membrane, tissue, mineral, and subtle refraction.
proof:
  - The same luminous path remains recognizable from microscopic abstraction through eye focus, gesture, connection, and message-safe hold.
timing:
  - Discovery 0–2 s; propagation 2–5.5 s; human transition 5.5–9 s; connection 9–12 s; hold 12–15 s.
typography_placeholder:
  - Reserve clean negative space only; final approved copy is composited deterministically in post.
negative_constraints:
  - No unrelated montage, accidental lettering, logos, black tail, or unsafe crop.
